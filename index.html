<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>크롬바스 고정팟 스케줄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Layout: stationery planner page — handwritten title, a 7-day overview strip, four member cards (cat-eared avatars in muted pastels), the raid day at the foot.
   Deliberately single-theme: warm off-white paper, brown ink, dusty pastels. */
:root {
  color-scheme: light;
  --bg: #faf5f5;
  --card: #fffefc;
  --ink: #4a403b;
  --muted: #958a83;
  --faint: #c9c1bb;
  --line: #f1e3e5;
  --tint: #f9f2f3;
  --hi: #fde6ec;      /* everyone-can-go highlight, matches the logo pink */
  --hi-ink: #d0607f;
  --font-hand: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
body { background:
    radial-gradient(60vw 420px at 50% -60px, #fde3eb, transparent 70%),
    radial-gradient(40vw 360px at 100% 100%, #fde9e0, transparent 70%),
    radial-gradient(40vw 360px at 0% 60%, #fbe8f0, transparent 70%),
    var(--bg);
  background-attachment: fixed; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; min-height: 100vh; }
/* floating sparkles, same 4-point star as the logo */
.sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.sky svg { position: absolute; fill: var(--s, #f4b6c6); opacity: .55; animation: twinkle var(--d, 5s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes twinkle { 0%, 100% { transform: scale(.75) rotate(0deg); opacity: .35; } 50% { transform: scale(1.05) rotate(12deg); opacity: .9; } }
@media (prefers-reduced-motion: reduce) { .sky svg { animation: none; } }
.wrap { position: relative; z-index: 1; max-width: 1140px; margin: 0 auto; padding-block: 44px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 34px; }

/* ---------- header ---------- */
header { display: grid; justify-items: center; gap: 2px; text-align: center; }
#title[hidden] { display: none; }
.logo { margin: -8px 0 4px; width: min(640px, 100%); position: relative; line-height: 0; }
.logo img { display: block; width: 100%; height: auto; max-width: 100%; filter: drop-shadow(0 3px 0 #f7d0d9) drop-shadow(0 10px 18px rgba(232, 130, 160, .16));
  animation: bob 4s ease-in-out infinite; }
.logo .gloss { position: absolute; inset: 0; pointer-events: none;
  -webkit-mask: var(--logo) center / 100% 100% no-repeat; mask: var(--logo) center / 100% 100% no-repeat;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%) 0 0 / 250% 100% no-repeat;
  animation: shine 12s ease-in-out infinite 2s, bob 4s ease-in-out infinite; background-position: 130% 0; }
@keyframes shine { 0%, 72% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .logo img, .logo .gloss { animation: none; } }
#title { font-family: var(--font-hand); font-weight: 800; font-size: clamp(26px, 4.4vw, 40px); line-height: 1.25; letter-spacing: -.02em; text-align: center; border: 0; background: transparent;
  color: var(--ink); width: 100%; padding: 2px 0; }
#title:focus { outline: none; text-decoration: underline wavy var(--faint) 2px; text-underline-offset: 10px; }
.week { font-family: var(--font-hand); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.weeknav { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.navbtn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
.navbtn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.navbtn:hover:not(:disabled) { border-color: var(--ink); }
.navbtn:focus-visible, #startpick:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#startpick { font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; min-height: 30px; }
#startpick:hover:not([readonly]) { border-color: var(--ink); }
.today { font-size: 12px; color: var(--muted); background: none; border: 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }
.today[hidden] { display: none; }

.label { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 2px 12px; flex-wrap: wrap; }
.label > span:first-child { font-family: var(--font-hand); font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 6px; }
.label > span:first-child svg { width: 14px; height: 14px; fill: #f0a3b8; }
.label .hint { font-size: 13px; color: var(--muted); }

/* ---------- summary strip ---------- */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cell { position: relative; font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 10px 4px 12px; box-shadow: 0 4px 14px rgba(232, 150, 172, .08);
  display: grid; justify-items: center; gap: 4px; cursor: default; transition: background .15s, border-color .15s; }
.cell .d { font-family: var(--font-hand); font-size: 13px; line-height: 1.1; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .d.wk { color: #c9867f; }
.cell .n { font-family: var(--font-hand); font-weight: 700; font-size: 21px; line-height: 1; font-variant-numeric: tabular-nums; }
.cell .n small { font-size: 13px; color: var(--faint); font-weight: 400; }
.pips { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.pip.ok { background: var(--pc); }
.pip.maybe { background: transparent; box-shadow: inset 0 0 0 1.5px var(--pc); }
.pip.no { background: var(--faint); opacity: .5; }
.pip.away { opacity: .25; }
.cell.all { background: var(--hi); border-color: #f4b3c4; cursor: pointer; }
.cell.all .n { color: var(--hi-ink); }
.cell.near { border-color: #f4b3c4; border-style: dashed; cursor: pointer; }
.cell.picked::after { content: "확정"; position: absolute; top: -11px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-family: var(--font-hand); font-weight: 700; font-size: 11px;
  color: var(--card); background: var(--ink); padding: 0 9px; border-radius: 999px; line-height: 20px; }
.cell:is(.all, .near):hover { border-color: var(--ink); }
.cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- member cards ---------- */
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .cols { grid-template-columns: minmax(0, 1fr); } }

.card { --c: #ebb4be; --cs: #fbf1f2; --cd: #b97683; min-width: 0; background: var(--card); border-radius: 22px; border: 1.5px solid var(--line); overflow: hidden; box-shadow: 0 10px 30px rgba(232, 150, 172, .12); }
.head { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; border-top: 4px solid var(--c); }
.chip { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); background: var(--c); cursor: pointer; padding: 0;
  box-shadow: 0 0 0 1px var(--line); transition: transform .12s; }
.chip:hover:not(:disabled) { transform: scale(1.12); }
.chip[aria-expanded="true"] { box-shadow: 0 0 0 1.5px var(--ink); }
.chip:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.nick { flex: 1; min-width: 0; font-family: var(--font-hand); font-weight: 700; font-size: 17px; border: 0; border-bottom: 1px dashed transparent; background: transparent; color: var(--ink); padding: 0; }
.nick:hover:not([readonly]) { border-bottom-color: var(--faint); }
.nick:focus { outline: none; border-bottom-color: var(--cd); }
.nick::placeholder { color: var(--faint); }

.palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; }
.palette[hidden] { display: none; }
.sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--card); background: var(--s); cursor: pointer; box-shadow: 0 0 0 1px var(--line); transition: transform .12s; }
.sw:hover { transform: scale(1.1); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 1.5px var(--ink); }
.sw:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.custom { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px 0 3px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); cursor: pointer; }
.custom:hover { border-color: var(--ink); color: var(--ink); }
.custom.on { border-color: var(--ink); color: var(--ink); }
.custom input { width: 16px; height: 16px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer; inline-size: 16px; block-size: 16px; }
.custom input::-webkit-color-swatch-wrapper { padding: 0; }
.custom input::-webkit-color-swatch { border: 0; border-radius: 50%; }
.custom input::-moz-color-swatch { border: 0; border-radius: 50%; }
.custom:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }

.join { margin: 0 16px; display: flex; align-items: center; gap: 9px; padding: 7px 12px; border-radius: 12px; background: var(--tint); cursor: pointer; user-select: none; transition: background .15s; }
.join:has(input:checked) { background: var(--cs); }
.join input { position: absolute; opacity: 0; pointer-events: none; }
.box { flex: none; width: 19px; height: 19px; border-radius: 6px; border: 1.5px solid var(--faint); background: var(--card); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 13px; height: 13px; stroke: var(--on, var(--ink)); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .15s; }
.join input:checked + .box { background: var(--c); border-color: var(--c); }
.join input:checked + .box svg { opacity: 1; }
.join input:focus-visible + .box { outline: 2px solid var(--ink); outline-offset: 2px; }
.join .jt { font-size: 14px; }
.join .js { font-family: var(--font-hand); font-size: 12px; color: var(--muted); margin-left: auto; line-height: 1; }
.join input:checked ~ .js { color: var(--cd); font-weight: 700; }

.days { display: grid; padding: 10px 12px 2px; }
.day { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 3px 8px; align-items: center; padding: 4px 4px; }
.dn { display: grid; justify-items: center; line-height: 1; }
.dn b { font-family: var(--font-hand); font-weight: 700; font-size: 14px; }
.dn span { font-family: var(--font-hand); font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dn.wk b { color: #c9867f; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--tint); border-radius: 999px; padding: 2px; }
.seg button { font: inherit; font-size: 13px; padding: 5px 0; border-radius: 999px; border: 0; background: transparent; color: var(--muted); cursor: pointer; transition: background .12s, color .12s; }
.seg button:hover:not(:disabled) { color: var(--ink); }
.seg button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.seg button.on[data-v="ok"] { background: var(--c); color: var(--on, var(--ink)); font-weight: 500; }
.seg button.on[data-v="maybe"] { background: var(--card); color: var(--cd); box-shadow: inset 0 0 0 1.5px var(--c); }
.seg button.on[data-v="no"] { background: var(--card); color: var(--faint); text-decoration: line-through; }
.time { grid-column: 2; font: inherit; font-size: 13px; border: 0; border-bottom: 1px dashed var(--line); background: transparent; color: var(--ink); width: 100%; padding: 2px 8px 3px; }
.time::placeholder { color: var(--faint); }
.time:focus { outline: none; border-bottom-color: var(--cd); }

.memo { display: block; width: calc(100% - 32px); margin: 10px 16px 16px; font: inherit; font-size: 14px; border: 0; background: var(--tint); color: var(--ink);
  border-radius: 14px; padding: 10px 12px; resize: vertical; min-height: 60px; }
.memo::placeholder { color: var(--muted); }
.memo:focus { outline: 1.5px solid var(--c); background: var(--card); }

/* ---------- raid day ---------- */
.raid { position: relative; overflow: hidden; background: linear-gradient(180deg, #fff, #fff6f8); border: 2px solid #f6c9d4; outline: 4px solid #fff; outline-offset: -8px;
  box-shadow: 0 12px 34px rgba(232, 150, 172, .18); border-radius: 26px; padding: 26px 20px; display: grid; justify-items: center; gap: 0; text-align: center; }
.raid .tl { font-family: var(--font-hand); font-weight: 700; font-size: 14px; color: #e0829c; display: inline-flex; align-items: center; gap: 8px; }
.raid .tl svg { width: 18px; height: 18px; fill: #f4b0c2; }
.raid .gem { position: absolute; width: 74px; height: 74px; fill: #fbe0e7; top: 50%; margin-top: -37px; }
.raid .gem.l { left: 22px; transform: rotate(-14deg); } .raid .gem.r { right: 22px; transform: rotate(14deg); }
@media (max-width: 640px) { .raid .gem { display: none; } }
.raid > :not(.gem) { position: relative; }
#confirmed { font-family: var(--font-hand); font-weight: 800; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.02em; text-align: center; border: 0; background: transparent; color: var(--ink);
  width: min(520px, 100%); padding: 0 4px; }
#confirmed::placeholder { color: var(--faint); }
#confirmed:focus { outline: none; text-decoration: underline wavy var(--faint) 2px; text-underline-offset: 8px; }
.raid .note { font-size: 13px; color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
.linkbtn { font: inherit; font-size: 12px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; cursor: pointer; padding: 3px 12px; }
.linkbtn:hover:not(:disabled), .linkbtn.armed { color: var(--card); background: var(--ink); border-color: var(--ink); }
[disabled] { cursor: default; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
window.addEventListener("error", e => { const el = document.getElementById("status"); if (el && el.textContent === "불러오는 중…") el.textContent = "페이지 코드에 오류가 있어요: " + (e.message || "알 수 없는 오류"); });
</script>

// ---------- dates: 7 days from the shared start date (default: this week's Monday) ----------
// Availability is keyed by weekday, so any 7-day window still has each weekday exactly once.
const DAY_MS = 864e5;
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const thisMonday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - ((today.getDay() + 6) % 7));
const startDate = () => parse(state.meta.start) || thisMonday;
const WD = ["sun","mon","tue","wed","thu","fri","sat"];
// days in display order: [key, name, date]
function order() {
  const s = startDate();
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + i);
    const k = WD[d.getDay()];
    return [k, DAYS.find(x => x[0] === k)[1], d];
  });
}
const dateFor = k => order().find(x => x[0] === k)[2];
const isWk = k => k === "sat" || k === "sun";

const strip = $("#strip");
strip.addEventListener("click", e => {
  const c = e.target.closest(".cell");
  if (!c || !canWrite || !(c.classList.contains("all") || c.classList.contains("near"))) return;
  const k = c.dataset.k, n = DAYS.find(x => x[0] === k)[1];
  const times = counted().map(id => (state.members[id].times || {})[k]).filter(Boolean);
  state.meta.confirmed = `${md(dateFor(k))} (${n})` + (times.length ? " " + latest(times) : "");
  render(); saveMeta();
});

const cols = $("#cols");
SLOTS.forEach((id, i) => {
  const card = document.createElement("article");
  card.className = "card";
  card.id = "card-" + id;
  card.innerHTML = `
    <div class="head">
      <input class="nick" id="nick-${id}" placeholder="닉네임 ${i + 1}" maxlength="16" aria-label="멤버 ${i + 1} 닉네임">
      <button class="chip" type="button" id="chip-${id}" aria-label="멤버 ${i + 1} 색 바꾸기" aria-expanded="false"></button>
    </div>
    <div class="palette" id="pal-${id}" hidden role="group" aria-label="색 고르기">
      ${Object.keys(COLORS).map(key => `<button type="button" class="sw" data-id="${id}" data-color="${key}" style="--s:${COLORS[key][0]}" aria-label="${key}" aria-pressed="false"></button>`).join("")}
      <label class="custom" title="원하는 색 직접 고르기"><input type="color" id="pick-${id}" data-id="${id}" aria-label="원하는 색 직접 고르기"><span>직접 고르기</span></label>
    </div>
    <label class="join"><input type="checkbox" id="join-${id}" data-id="${id}"><span class="box">${CHECK}</span><span class="jt">이번 주 참여</span><span class="js" id="js-${id}">미정</span></label>
    <div class="days" id="days-${id}"></div>
    <textarea class="memo" id="memo-${id}" placeholder="메모" maxlength="200" aria-label="메모"></textarea>`;
  cols.appendChild(card);
});

// (re)build the day rows whenever the start date changes
let laidOut = "";
function layoutDays() {
  const key = iso(startDate());
  if (key === laidOut) return;
  laidOut = key;
  const o = order();
  strip.innerHTML = o.map(([k, n, d]) =>
    `<button type="button" class="cell" id="cell-${k}" data-k="${k}"><span class="d${isWk(k) ? " wk" : ""}">${n} ${md(d)}</span><span class="n">0</span><span class="pips"></span></button>`).join("");
  SLOTS.forEach(id => {
    $("#days-" + id).innerHTML = o.map(([k, n, d]) => `
      <div class="day">
        <span class="dn${isWk(k) ? " wk" : ""}"><b>${n}</b><span>${md(d)}</span></span>
        <div class="seg" role="group" aria-label="${n}요일">
          ${VALS.map(([v, l]) => `<button type="button" data-id="${id}" data-k="${k}" data-v="${v}" aria-pressed="false">${l}</button>`).join("")}
        </div>
        <input class="time" id="tm-${id}-${k}" data-id="${id}" data-k="${k}" placeholder="몇 시부터? 예: 21시~" maxlength="20" hidden aria-label="${n}요일 시간">
      </div>`).join("");
  });
}

// ---------- helpers ----------
// Members counted in the summary: those who ticked "이번 주 참여"; until anyone ticks, everyone counts.
const checked = () => SLOTS.filter(id => state.members[id].joining);
const counted = () => checked().length ? checked() : SLOTS;
const dayOf = (id, k) => (state.members[id].days || {})[k] || "";
const isHex = v => /^#[0-9a-f]{6}$/i.test(v || "");
function mix(hex, to, t) { // blend hex toward rgb `to` by t
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255];
  return "#" + c.map((v, i) => Math.round(v + (to[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function onColor(hex) { // text colour that stays readable on top of `hex`
  const n = parseInt(hex.slice(1), 16);
  const lin = v => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; };
  const L = .2126 * lin(n >> 16) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255);
  return L < .36 ? "#ffffff" : "#4a403b";
}
const colorOf = id => {
  const v = state.members[id].color;
  if (isHex(v)) return [v, mix(v, [255, 254, 252], .86), onColor(v) === "#ffffff" ? v : mix(v, [60, 45, 40], .45)];
  return COLORS[v] || COLORS[DEFAULT_COLOR[id]];
};
function startMin(t) { // "22", "22시", "21:30", "21시 30분", "오후 9시" → minutes after midnight, or -1
  const m = /(\d{1,2})(?:\s*(?:시|:)\s*(\d{1,2})?)?/.exec(t);
  if (!m) return -1;
  let h = +m[1], mi = +(m[2] || 0);
  if (/오후|저녁|밤|pm/i.test(t) && h < 12) h += 12;
  return h <= 24 && mi < 60 ? h * 60 + mi : -1;
}
function latest(times) { // the latest start time anyone wrote, else the first note
  const best = Math.max(...times.map(startMin));
  if (best < 0) return times[0];
  const h = Math.floor(best / 60), mi = best % 60;
  return mi ? `${h}시 ${mi}분` : `${h}시`;
}
function setVal(el, v) { if (document.activeElement !== el && el.value !== v) el.value = v; }

// ---------- render ----------
function render() {
  layoutDays();
  const o = order(), s = startDate();
  const weeks = Math.round((s - thisMonday) / (7 * DAY_MS));
  const rel = s <= today && today < new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7) ? "이번 주 " : weeks === 1 ? "다음 주 " : weeks === -1 ? "지난주 " : "";
  $("#week").textContent = `${rel}${md(o[0][2])} ${o[0][1]} – ${md(o[6][2])} ${o[6][1]}`;
  setVal($("#startpick"), iso(s));
  $("#today").hidden = !rel.startsWith("이번") ? false : true;
  setVal($("#title"), state.meta.title || "");
  setVal($("#confirmed"), state.meta.confirmed || "");

  SLOTS.forEach((id, i) => {
    const m = state.members[id];
    const [c, cs, cd] = colorOf(id);
    const card = $("#card-" + id);
    card.style.setProperty("--c", c); card.style.setProperty("--cs", cs); card.style.setProperty("--cd", cd);
    card.style.setProperty("--on", onColor(c));
    setVal($("#nick-" + id), m.name || "");
    setVal($("#memo-" + id), m.memo || "");
    document.querySelectorAll(`#pal-${id} .sw`).forEach(s => s.setAttribute("aria-pressed", s.dataset.color === (m.color || DEFAULT_COLOR[id])));
    const pick = $("#pick-" + id); if (document.activeElement !== pick) pick.value = c;
    pick.parentElement.classList.toggle("on", isHex(m.color));
    $("#join-" + id).checked = !!m.joining;
    $("#js-" + id).textContent = m.joining ? "참여해요" : "미정";
    DAYS.forEach(([k]) => {
      const s = dayOf(id, k);
      document.querySelectorAll(`.seg button[data-id="${id}"][data-k="${k}"]`).forEach(b => {
        const on = b.dataset.v === s; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
      });
      const tm = $(`#tm-${id}-${k}`);
      tm.hidden = !(s === "ok" || s === "maybe");
      setVal(tm, (m.times || {})[k] || "");
    });
  });

  renderStrip();
  document.querySelectorAll("input:not([type=checkbox]), textarea").forEach(el => el.readOnly = !canWrite);
  document.querySelectorAll(".seg button, .chip, .sw, input[type=color], #reset, #prev, #next, #today, input[type=checkbox]").forEach(el => el.disabled = !canWrite);
}

function renderStrip() {
  const req = counted();
  const nChecked = checked().length;
  const filled = req.filter(id => Object.values(state.members[id].days || {}).some(Boolean)).length;
  const conf = state.meta.confirmed || "";
  let anyAll = false;
  order().forEach(([k, n, d]) => {
    const c = $("#cell-" + k);
    const ss = req.map(id => dayOf(id, k));
    const ok = ss.filter(s => s === "ok").length;
    const ready = filled === req.length;
    const all = ready && ss.every(s => s === "ok");
    const near = !all && ready && ss.every(s => s === "ok" || s === "maybe");
    anyAll = anyAll || all;
    c.classList.toggle("all", all);
    c.classList.toggle("near", near);
    c.classList.toggle("picked", !!conf && conf.startsWith(md(d) + " "));
    c.querySelector(".n").innerHTML = `${ok}<small>/${req.length}</small>`;
    c.querySelector(".pips").innerHTML = SLOTS.map(id =>
      `<span class="pip ${dayOf(id, k)}${req.includes(id) ? "" : " away"}" style="--pc:${colorOf(id)[0]}"></span>`).join("");
    c.setAttribute("aria-label", `${n}요일 ${ok}/${req.length}명 가능` + (all ? ", 전원 가능" : near ? ", 애매 포함 가능" : ""));
    c.tabIndex = all || near ? 0 : -1;
  });
  const who = nChecked ? `참여 체크한 ${nChecked}명 기준` : "4명 기준";
  $("#striphint").textContent = filled < req.length
    ? `${who} · ${filled}/${req.length}명 입력 완료`
    : anyAll ? `${who} · 가능한 요일이 있어요` : `${who} · 일정이 되는 날이 없어요`;
}

// ---------- writes ----------
const timers = {}, busy = {}, again = {}, pending = {};
function debounce(key, fn, ms = 600) { pending[key] = true; clearTimeout(timers[key]); timers[key] = setTimeout(() => { pending[key] = false; fn(); }, ms); }
async function write(path, key, data) {
  if (!db || !canWrite) return;
  if (busy[key]) { again[key] = data; return; }
  busy[key] = true;
  try { await db.doc(path).set(data); status("저장성공!"); }
  catch (e) {
    if (e && e.code === "permission-denied") status("저장이 거부.");
    else status("저장 실패. 잠시 후 다시 해 주세요.");
  } finally {
    busy[key] = false;
    if (again[key]) { const d = again[key]; again[key] = null; write(path, key, d); }
  }
}
const saveMeta = () => write("party/main", "meta", { ...state.meta });
const saveMember = id => write("members/" + id, id, JSON.parse(JSON.stringify(state.members[id])));

$("#title").addEventListener("input", e => { state.meta.title = e.target.value; debounce("meta", saveMeta); });
$("#confirmed").addEventListener("input", e => { state.meta.confirmed = e.target.value; renderStrip(); debounce("meta", saveMeta); });
cols.addEventListener("click", e => {
  if (!canWrite) return;
  const b = e.target.closest(".seg button");
  if (b) {
    const { id, k, v } = b.dataset, m = state.members[id];
    m.days = { ...(m.days || {}) };
    m.days[k] = m.days[k] === v ? "" : v;
    render(); debounce(id, () => saveMember(id), 250);
    return;
  }
  const sw = e.target.closest(".sw");
  if (sw) {
    const id = sw.dataset.id;
    state.members[id].color = sw.dataset.color;
    render(); debounce(id, () => saveMember(id), 250);
    return;
  }
  const chip = e.target.closest(".chip");
  if (chip) {
    const id = chip.id.slice(5), pal = $("#pal-" + id);
    pal.hidden = !pal.hidden; chip.setAttribute("aria-expanded", !pal.hidden);
  }
});
cols.addEventListener("change", e => {
  const id = e.target.matches("input[type=checkbox]") && e.target.dataset.id;
  if (!id) return;
  state.members[id].joining = e.target.checked; render(); debounce(id, () => saveMember(id), 200);
});
SLOTS.forEach(id => {
  const m = () => state.members[id];
  $("#nick-" + id).addEventListener("input", e => { m().name = e.target.value; render(); debounce(id, () => saveMember(id)); });
  $("#memo-" + id).addEventListener("input", e => { m().memo = e.target.value; debounce(id, () => saveMember(id)); });
});
cols.addEventListener("input", e => {
  if (e.target.type === "color") {
    const id = e.target.dataset.id;
    state.members[id].color = e.target.value; render(); debounce(id, () => saveMember(id), 400);
    return;
  }
  if (!e.target.classList.contains("time")) return;
  const { id, k } = e.target.dataset, m = state.members[id];
  m.times = { ...(m.times || {}), [k]: e.target.value }; debounce(id, () => saveMember(id));
});

function setStart(d) {
  if (!canWrite || !d) return;
  state.meta.start = iso(d);
  render(); debounce("meta", saveMeta, 300);
}
$("#prev").addEventListener("click", () => { const s = startDate(); setStart(new Date(s.getFullYear(), s.getMonth(), s.getDate() - 7)); });
$("#next").addEventListener("click", () => { const s = startDate(); setStart(new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7)); });
$("#today").addEventListener("click", () => setStart(thisMonday));
$("#startpick").addEventListener("change", e => setStart(parse(e.target.value)));

$("#reset").addEventListener("click", () => {
  const btn = $("#reset");
  if (!resetArmed) {
    resetArmed = true; btn.classList.add("armed"); btn.textContent = "한 번 더 누르면 요일·참여·확정일이 삭제돼용.";
    setTimeout(() => { resetArmed = false; btn.classList.remove("armed"); btn.textContent = "이번 주 기록 비우기"; }, 4000);
    return;
  }
  resetArmed = false; btn.classList.remove("armed"); btn.textContent = "이번 주 기록 비우기";
  SLOTS.forEach(id => { const m = state.members[id]; m.days = {}; m.times = {}; m.joining = false; saveMember(id); });
  state.meta.confirmed = ""; saveMeta(); render();
});

// ---------- live data (Firebase Firestore) ----------
render();
(() => {
  if (!FIREBASE_CONFIG.projectId || !window.firebase) { status("저장소 설정이 아직 안 돼서 이 화면에서만 보여요."); return; }
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
  catch (e) { status("저장소에 연결하지 못했어요. 설정값을 확인해 주세요."); return; }
  status("연결됐어요 · 입력하면 자동 저장돼요");

  db.doc("party/main").onSnapshot(s => {
    if (!s.exists || s.metadata.hasPendingWrites || pending.meta || busy.meta) return;
    state.meta = { ...state.meta, ...s.data() }; render();
  }, () => status("불러오지 못했어요. 새로고침해 주세요."));
  db.collection("members").onSnapshot(qs => {
    let changed = false;
    qs.docs.forEach(d => {
      if (!SLOTS.includes(d.id) || d.metadata.hasPendingWrites || pending[d.id] || busy[d.id]) return;
      const v = d.data();
      state.members[d.id] = { name: v.name || "", days: { ...(v.days || {}) }, times: { ...(v.times || {}) }, memo: v.memo || "",
        joining: !!v.joining, color: COLORS[v.color] || isHex(v.color) ? v.color : DEFAULT_COLOR[d.id] };
      changed = true;
    });
    if (changed) render();
  }, () => status("불러오지 못했어요. 새로고침해 주세요."));
})();
</script>

</body>
</html>
